name: Daily brief

# Everything happens here: collect the channels, write the brief via the Claude
# API, commit it, send it. A scheduled Claude session cannot write to GitHub by
# any route, so generation moved to the runner, which has open internet.
on:
  schedule:
    - cron: '47 5 * * 1-5'        # 08:47 Moscow — GitHub cron drifts, so early
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Collect Telegram channels
        continue-on-error: true     # a stale digest must not stop the brief
        run: python3 .github/scripts/collect_telegram.py

      - name: Write the brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRIEF_MODEL: ${{ vars.BRIEF_MODEL }}
        run: python3 .github/scripts/generate_brief.py

      - name: Commit
        run: |
          if [ -n "$(git status --porcelain briefs/ sources/)" ]; then
            git config user.name  "Mark"
            git config user.email "noreply@anthropic.com"
            git add briefs/ sources/
            git commit -m "Brief $(TZ=Europe/Moscow date +%Y-%m-%d)"
            for i in 1 2 3; do
              git push && break
              git pull --rebase --autostash -q || true
            done
          fi

      - name: Send to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 .github/scripts/send.py
