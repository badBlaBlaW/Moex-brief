name: Daily brief

# One job does everything: scrape the Telegram channels, write the brief, commit
# it, send it.
#
# The brief is written by Claude Code running on the runner, authenticated with
# a Claude subscription (CLAUDE_CODE_OAUTH_TOKEN) rather than API credits.
# A scheduled Claude session cannot write to GitHub by any route, which is why
# generation lives here and not in a scheduled task.
on:
  schedule:
    - cron: '47 5 * * 1-5'        # 08:47 Moscow — GitHub cron drifts, so early
  workflow_dispatch:
    inputs:
      use_existing:
        description: 'Test delivery only — send this brief instead of writing a new one, e.g. briefs/2026-11-19.md. Blank = normal run.'
        required: false
        default: ''

permissions:
  contents: write
  id-token: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Collect Telegram channels
        continue-on-error: true     # a stale digest must not stop the brief
        run: python3 .github/scripts/collect_telegram.py

      - name: Settle the date and the target file
        id: now
        env:
          USE_EXISTING: ${{ github.event.inputs.use_existing }}
        run: |
          echo "date=$(TZ=Europe/Moscow date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "human=$(TZ=Europe/Moscow LC_ALL=C date '+%A %d %B %Y, %H:%M')" >> "$GITHUB_OUTPUT"
          # A named existing brief means "test the plumbing": skip generation,
          # spend no tokens, still run the gate, the commit and the send.
          if [ -n "${USE_EXISTING:-}" ]; then
            if [ ! -f "$USE_EXISTING" ]; then
              echo "::error::$USE_EXISTING does not exist in this repository"; exit 1
            fi
            echo "brief=$USE_EXISTING"  >> "$GITHUB_OUTPUT"
            echo "generate=0"           >> "$GITHUB_OUTPUT"
            echo "::notice::delivery test — resending $USE_EXISTING, nothing will be written"
          else
            echo "brief=briefs/$(TZ=Europe/Moscow date +%Y-%m-%d).md" >> "$GITHUB_OUTPUT"
            echo "generate=1"           >> "$GITHUB_OUTPUT"
          fi

      - name: Write the brief
        if: steps.now.outputs.generate == '1'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Our own token, so the Claude GitHub App does not need installing.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Today is ${{ steps.now.outputs.human }} Moscow time.

            Read the file .github/prompts/brief.md and follow it exactly.

            Write the finished brief to briefs/${{ steps.now.outputs.date }}.md
            and change no other file.
          claude_args: |
            # An alias always resolves to the current model; a full name can go
            # stale and fail the run. Set the BRIEF_MODEL variable to 'opus' for
            # better judgement at higher cost.
            --model ${{ vars.BRIEF_MODEL || 'sonnet' }}
            --max-turns 60
            --allowedTools "Read,Write,Glob,Grep,WebSearch,WebFetch"

      - name: Check the brief is real
        env:
          BRIEF: ${{ steps.now.outputs.brief }}
        run: python3 .github/scripts/check_brief.py

      - name: Commit
        run: |
          if [ -n "$(git status --porcelain briefs/ sources/)" ]; then
            git config user.name  "Mark"
            git config user.email "noreply@anthropic.com"
            git add briefs/ sources/
            git commit -m "Brief ${{ steps.now.outputs.date }}"
            for i in 1 2 3; do
              git push && break
              git pull --rebase --autostash -q || true
            done
          else
            echo "::warning::nothing to commit"
          fi

      - name: Send to Telegram
        env:
          # Preferred route: the Worker holds the enrolled devices, so a phone
          # that enrolled itself through an invite link is included. Unset until
          # the Worker is deployed, in which case this sends directly instead.
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          # Fallback route, and what runs when no Worker is configured.
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_OWNERS: ${{ secrets.TELEGRAM_OWNERS }}
          # Name it, so a failed run can never fall back to yesterday's brief.
          BRIEF_FILE: ${{ steps.now.outputs.brief }}
        run: python3 .github/scripts/publish.py
