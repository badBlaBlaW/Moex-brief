name: Answer the bot (temporary bridge)

# A stopgap until the Cloudflare Worker in worker/ is live. Polls every 15
# minutes so /start and the buttons work at all. Once the Worker's webhook is
# set, Telegram stops serving getUpdates and this retires itself quietly —
# delete this file and .github/scripts/listen.py at that point.
on:
  schedule:
    - cron: '*/15 5-20 * * *'       # 08:00-23:00 Moscow
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-bridge
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read any messages
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 .github/scripts/listen.py
      - name: Remember any change
        run: |
          if [ -n "$(git status --porcelain config.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add config.json && git commit -m "bot: update settings" && git push
          else
            echo "nothing to save"
          fi
