name: Mark is listening

# Holds a long-poll open to Telegram so replies are immediate.
#
# THE SCHEDULE IS DELIBERATELY OFF. Shifts every five hours consumed roughly
# 3,000 Actions minutes a month against a 2,000-minute free allowance on a
# private repository, which stopped every workflow in the repository — the
# brief included. Start a shift by hand (Actions → Mark is listening → Run
# workflow) or move the bot onto the Cloudflare Worker in worker/, which has no
# minute budget at all. Do not restore the cron on a private repository.
on:
  workflow_dispatch:

permissions:
  contents: write        # to remember the language choice
  actions: write         # to start the next shift

concurrency:
  group: mark-listener   # never two pollers: Telegram 409s if they overlap
  cancel-in-progress: false

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Listen
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 .github/scripts/listen.py

      - name: Hand over to the next shift
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run listen.yml --repo "$GITHUB_REPOSITORY"
