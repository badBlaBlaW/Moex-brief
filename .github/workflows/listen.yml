name: Mark is listening

# Holds a long-poll open to Telegram so replies are immediate. Each run listens
# for just under six hours, then starts the next one, so the chain is
# continuous. The schedule is only a safety net if a link in the chain breaks.
on:
  workflow_dispatch:
  schedule:
    - cron: '7 */5 * * *'

permissions:
  contents: write        # to remember the language choice
  actions: write         # to start the next shift

concurrency:
  group: mark-listener   # never two pollers: Telegram 409s if they overlap
  cancel-in-progress: false

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Listen
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 .github/scripts/listen.py

      - name: Hand over to the next shift
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run listen.yml --repo "$GITHUB_REPOSITORY"
