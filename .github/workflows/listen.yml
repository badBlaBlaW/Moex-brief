name: Check for button presses

# Runs once each weekday, just before the brief is written — not a polling loop.
# Run it by hand from the Actions tab during setup, or any time you want an
# immediate answer.
on:
  schedule:
    - cron: '41 5 * * 1-5'          # 08:41 Moscow, ~10 min before the brief
  workflow_dispatch:

permissions:
  contents: write                   # to remember the language choice

concurrency:
  group: telegram-listen
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read any commands
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 .github/scripts/listen.py

      - name: Remember any change
        run: |
          if [ -n "$(git status --porcelain config.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add config.json
            git commit -m "bot: update settings"
            git push
          else
            echo "nothing to save"
          fi
