name: Publish a brief

# The scheduled session cannot write to GitHub — the proxy blocks git push AND
# the REST contents API. Dispatching a workflow is permitted, so the brief
# travels as an input and this job writes it. Pushing briefs/*.md then triggers
# the Telegram relay as usual.
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Brief date, YYYY-MM-DD (Moscow)'
        required: true
      body:
        description: 'Full markdown of the brief'
        required: true

permissions:
  contents: write

concurrency:
  group: publish-brief
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write the brief
        env:
          BRIEF_DATE: ${{ github.event.inputs.date }}
          BRIEF_BODY: ${{ github.event.inputs.body }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          d = os.environ["BRIEF_DATE"].strip()
          if not re.fullmatch(r"\d{4}-\d{2}-\d{2}", d):
              raise SystemExit(f"refusing a bad date: {d!r}")
          body = os.environ["BRIEF_BODY"]
          if len(body.strip()) < 200:
              raise SystemExit("refusing a suspiciously short brief")
          p = pathlib.Path("briefs") / f"{d}.md"
          p.parent.mkdir(exist_ok=True)
          p.write_text(body.rstrip() + "\n", encoding="utf-8")
          print(f"wrote {p} ({len(body)} chars)")
          PY
      - name: Commit
        run: |
          if [ -n "$(git status --porcelain briefs/)" ]; then
            git config user.name  "Mark"
            git config user.email "noreply@anthropic.com"
            git add briefs/
            git commit -m "Brief ${{ github.event.inputs.date }}"
            for i in 1 2 3; do
              git push && exit 0
              git pull --rebase --autostash -q || true
            done
            exit 1
          else
            echo "brief unchanged"
          fi

      # A push made with GITHUB_TOKEN does not trigger other workflows — GitHub
      # blocks that to prevent loops. So send from here rather than relying on
      # the relay firing on push.
      - name: Send to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRIEF_FILE: briefs/${{ github.event.inputs.date }}.md
        run: python3 .github/scripts/send.py
